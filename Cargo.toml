[workspace]
resolver = "3"
members = ["crates/pm-types", "crates/pm-venue", "crates/pm-core", "crates/pm-live", "crates/pm-backtest"]

[workspace.package]
edition = "2021"
rust-version = "1.84"
version = "0.1.0"
publish = false

[workspace.dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "io-util"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }  # HTTP/2 negotiated by ALPN
ed25519-dalek = "2"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
rand = "0.8"
